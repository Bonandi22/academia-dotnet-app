services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: academia-dotnet-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Change_this_password_123!"
    ports:
      - "3311:1433"
    volumes:
      - academia_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Change_this_password_123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
volumes:
  academia_sql_data:
