services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Change_this_password_123!"
    ports:
      - "3311:1433"
    volumes:
      - academia_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Change_this_password_123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Academia.Api/Dockerfile
    # Stack "tipo produção": sem Swagger nem Lab (o Lab recusa-se a arrancar fora de Development).
    # A API não publica porta: só é alcançável através do nginx em http://localhost:4200/api, e por isso
    # pode confiar no X-Forwarded-For que o nginx envia (rate limiting por IP do cliente real).
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Academia: "Server=sqlserver,1433;Database=AcademiaDotNet;User Id=sa;Password=Change_this_password_123!;TrustServerCertificate=True;Encrypt=False"
      # Em Production a API recusa a chave versionada nos appsettings: vem do .env (ver .env.example).
      Jwt__Secret: ${JWT_SECRET:?Define JWT_SECRET no ficheiro .env da raiz - ver .env.example}
      Jwt__Issuer: AcademiaDotNet
      Jwt__Audience: AcademiaDotNet.Client
      ReverseProxy__TrustForwardedHeaders: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  academia_sql_data:
